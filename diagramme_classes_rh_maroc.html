
<style>
#erd { padding: 8px 0; }
#erd svg { max-width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '12px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a5a' : '#EEEDFE',
    primaryBorderColor: dark ? '#534AB7' : '#534AB7',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    secondaryColor: dark ? '#0a3d30' : '#E1F5EE',
    secondaryBorderColor: dark ? '#0F6E56' : '#0F6E56',
    tertiaryColor: dark ? '#3d2010' : '#FAEEDA',
    tertiaryBorderColor: dark ? '#854F0B' : '#854F0B',
  },
});

const diagram = `classDiagram
  class Company {
    +id
    +name
    +ice
    +rc
    +patente
    +cnss_affiliation
    +address
    +city
    +email
    +phone
  }

  class User {
    +id
    +company_id
    +name
    +email
    +password
    +role: admin|rh|manager|comptable
  }

  class Department {
    +id
    +company_id
    +name
    +description
    +manager_id
  }

  class Position {
    +id
    +company_id
    +title
    +description
    +base_salary
  }

  class Employee {
    +id
    +company_id
    +matricule
    +cin
    +cnss_number
    +first_name
    +last_name
    +date_of_birth
    +hire_date
    +contract_type
    +marital_status
    +number_of_children
    +rib
    +department_id
    +position_id
    +status
  }

  class Contract {
    +id
    +company_id
    +employee_id
    +contract_type
    +start_date
    +end_date
    +salary_base
    +trial_period_end
    +working_hours_per_week
    +status
  }

  class Attendance {
    +id
    +company_id
    +employee_id
    +date
    +check_in
    +check_out
    +worked_hours
    +overtime_hours
  }

  class LeaveType {
    +id
    +company_id
    +name
    +legal_days_per_year
  }

  class Leave {
    +id
    +company_id
    +employee_id
    +leave_type_id
    +start_date
    +end_date
    +status: en_attente|approuvé|refusé
    +approved_by
  }

  class Payroll {
    +id
    +company_id
    +employee_id
    +month
    +year
    +salaire_brut
    +total_cnss_employee
    +total_cnss_employer
    +amo
    +ir
    +salaire_net
    +status
  }

  class PayrollComponent {
    +id
    +payroll_id
    +type: prime|retenue|avantage
    +label
    +amount
    +taxable: bool
  }

  class CnssRate {
    +id
    +company_id
    +type: employee|employer
    +label
    +rate_percentage
    +plafond
  }

  class IrBracket {
    +id
    +min_salary
    +max_salary
    +rate_percentage
    +deduction_amount
  }

  class Declaration {
    +id
    +company_id
    +type: CNSS|IR|Etat_9421
    +month
    +year
    +generated_file_path
    +status
  }

  Company "1" --> "many" User : emploie
  Company "1" --> "many" Department : possède
  Company "1" --> "many" Position : définit
  Company "1" --> "many" Employee : emploie
  Company "1" --> "many" Contract : établit
  Company "1" --> "many" Payroll : génère
  Company "1" --> "many" Leave : gère
  Company "1" --> "many" Attendance : enregistre
  Company "1" --> "many" Declaration : produit
  Company "1" --> "many" LeaveType : configure
  Company "0..1" --> "many" CnssRate : paramètre

  Department "1" --> "many" Employee : regroupe
  Position "1" --> "many" Employee : occupe

  Employee "1" --> "many" Contract : signe
  Employee "1" --> "many" Attendance : pointe
  Employee "1" --> "many" Leave : demande
  Employee "1" --> "many" Payroll : reçoit

  Payroll "1" --> "many" PayrollComponent : contient
  LeaveType "1" --> "many" Leave : catégorise
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
</script>
